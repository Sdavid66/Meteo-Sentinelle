<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="42%" cy="32%" r="78%">
      <stop offset="0%"  stop-color="#1462b4"/>
      <stop offset="55%" stop-color="#0d4a92"/>
      <stop offset="100%" stop-color="#0a2f63"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9fe3f5"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="250" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="242" fill="none" stroke="#5bc8e8" stroke-opacity="0.55" stroke-width="7"/>

  <!-- Feuille : la plante protégée -->
