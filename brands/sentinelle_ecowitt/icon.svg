    <g stroke="#0d4a92" stroke-opacity="0.30" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M0,58 L-52,20"/>  <path d="M0,58 L52,20"/>
      <path d="M0,4  L-56,-38"/> <path d="M0,4  L56,-38"/>
      <path d="M0,-50 L-42,-84"/><path d="M0,-50 L42,-84"/>
    </g>
  </g>

  <!-- Flocon : la menace surveillée (gel) -->
