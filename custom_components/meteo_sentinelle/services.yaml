# Les libellés des listes déroulantes ne sont pas écrits ici : le
# « translation_key » les fait résoudre dans la section « selector » de
# strings.json, donc dans la langue de l'utilisateur. Un libellé écrit
# en dur figerait l'interface en français.

log_treatment:
  name: Enregistrer un traitement
  description: >-
    Déclare une application de traitement. Le plugin en déduit jusqu'à
    quand la culture est protégée, en tenant compte de la rémanence et du
    lessivage par la pluie. Renseignez ces deux valeurs d'après
    l'étiquette du produit.
  fields:
    target:
      name: Cible
      description: Maladie ou ravageur visé par le traitement.
      required: true
      selector:
        select:
          translation_key: treatable_model
          options:
            - late_blight
            - powdery_mildew
            - codling_moth
            - cherry_fruit_fly
            - colorado_potato_beetle
            - grapevine_moth
    tree:
      name: Arbre(s)
      description: >-
        Nom du ou des arbres traités, tel qu'affiché dans Home Assistant
        (ex. « Pommier Golden »). Laisser vide pour appliquer à tous les
        arbres concernés par cette cible.
      example: Pommier Golden
      selector:
        object:
    product:
      name: Produit
      description: Nom du produit appliqué, à titre de traçabilité.
      example: Bouillie bordelaise
      selector:
        text:
    residual_days:
      name: Rémanence (jours)
      description: Durée de protection nominale indiquée par le fabricant.
      default: 7
      selector:
        number:
          min: 0
          max: 90
          step: 0.5
          unit_of_measurement: jours
          mode: box
    rainfast_mm:
      name: Lessivage (mm)
      description: >-
        Cumul de pluie à partir duquel la protection est considérée comme
        perdue. Mettre 0 pour désactiver la prise en compte du lessivage.
      default: 20
      selector:
        number:
          min: 0
          max: 500
          step: 1
          unit_of_measurement: mm
          mode: box

clear_treatment:
  name: Effacer un traitement
  description: Supprime le traitement enregistré.
  fields:
    target:
      name: Cible
      description: Laisser vide pour effacer toutes les cibles.
      selector:
        select:
          translation_key: treatable_model
          options:
            - late_blight
            - powdery_mildew
            - codling_moth
            - cherry_fruit_fly
            - colorado_potato_beetle
            - grapevine_moth
    tree:
      name: Arbre(s)
      description: Laisser vide pour effacer sur tous les arbres.
      selector:
        object:

reset_powdery_mildew_index:
  name: Réinitialiser l'indice oïdium
  description: >-
    Remet l'indice Gubler-Thomas à zéro et annule le démarrage de
    l'épidémie. À utiliser en début de saison.
  fields:
    tree:
      name: Arbre(s)
      description: Laisser vide pour réinitialiser tous les arbres.
      selector:
        object:

set_stage:
  name: Définir le stade phénologique
  description: >-
    Force le stade d'un ou plusieurs arbres. Une correction manuelle fait
    autorité : elle devient la nouvelle référence de l'avancement
    automatique.
  fields:
    tree:
      name: Arbre(s)
      description: Nom du ou des arbres concernés.
      required: true
      example: Pommier Golden
      selector:
        object:
    stage:
      name: Stade
      description: >-
        Clé technique du stade (ex. full_bloom, green_tip). Visible dans
        l'attribut « stage_key » du capteur de stade.
      required: true
      example: full_bloom
      selector:
        text:

set_biofix:
  name: Déclarer un biofix
  description: >-
    Donne son origine au cumul de degrés-jours d'un ravageur : première
    capture soutenue au piège à phéromone pour le carpocapse, premières
    pontes observées pour le doryphore. Votre observation fait autorité
    et remplace le biofix estimé à partir du stade phénologique.
  fields:
    pest:
      name: Ravageur
      description: Modèle dont on déclare l'origine du cumul.
      required: true
      selector:
        select:
          translation_key: pest
          options:
            - codling_moth
            - cherry_fruit_fly
            - colorado_potato_beetle
            - grapevine_moth
    tree:
      name: Arbre(s)
      description: >-
        Laisser vide pour appliquer à tous les arbres concernés par ce
        ravageur.
      example: Pommier Golden
      selector:
        object:
    date:
      name: Date
      description: >-
        Jour de l'observation. Par défaut aujourd'hui. Une date
        antérieure au début de l'historique connu ne peut pas être
        reconstituée : le cumul repart alors du début de la série.
      selector:
        date:

clear_biofix:
  name: Effacer un biofix
  description: >-
    Retire l'origine du cumul : le modèle se remet en attente d'une
    observation. Utile en début de saison.
  fields:
    pest:
      name: Ravageur
      description: Laisser vide pour effacer tous les ravageurs.
      selector:
        select:
          translation_key: pest
          options:
            - codling_moth
            - cherry_fruit_fly
            - colorado_potato_beetle
            - grapevine_moth
    tree:
      name: Arbre(s)
      description: Laisser vide pour effacer sur tous les arbres.
      selector:
        object:
