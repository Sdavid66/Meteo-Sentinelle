name: Release

# Le push d'un tag « vX.Y.Z » crée automatiquement la release GitHub
# correspondante. HACS exige une release complète : publier un tag seul
# ne suffit pas, et c'est précisément ce que ce workflow automatise.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier que le manifest correspond au tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(python3 -c "import json;print(json.load(open('custom_components/meteo_sentinelle/manifest.json'))['version'])")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Le tag ($TAG) ne correspond pas au manifest ($MANIFEST)." >&2
            exit 1
          fi
          echo "Version cohérente : $TAG"

      - name: Créer la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -f "release-notes/${TAG}.md" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "release-notes/${TAG}.md"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
