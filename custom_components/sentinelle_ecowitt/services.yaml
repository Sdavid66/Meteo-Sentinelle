log_treatment:
  name: Enregistrer un traitement
  description: >-
    Déclare une application de traitement pour une maladie donnée. Le
    plugin en déduit jusqu'à quand la culture est protégée, en tenant
    compte de la rémanence et du lessivage par la pluie. Renseignez la
    rémanence et la résistance au lavage d'après l'étiquette du produit.
  fields:
    target:
      name: Maladie visée
      description: Modèle de risque concerné par le traitement.
      required: true
      selector:
        select:
          options:
            - label: Mildiou
              value: late_blight
            - label: Oïdium
              value: powdery_mildew
    product:
      name: Produit
      description: Nom du produit appliqué, à titre de traçabilité.
      example: Bouillie bordelaise
      selector:
        text:
    residual_days:
      name: Rémanence (jours)
      description: Durée de protection nominale indiquée par le fabricant.
      default: 7
      selector:
        number:
          min: 0
          max: 90
          step: 0.5
          unit_of_measurement: jours
          mode: box
    rainfast_mm:
      name: Lessivage (mm)
      description: >-
        Cumul de pluie à partir duquel la protection est considérée comme
        perdue. Mettre 0 pour désactiver la prise en compte du lessivage.
      default: 20
      selector:
        number:
          min: 0
          max: 500
          step: 1
          unit_of_measurement: mm
          mode: box

clear_treatment:
  name: Effacer un traitement
  description: Supprime le traitement enregistré (toutes les maladies si aucune n'est précisée).
  fields:
    target:
      name: Maladie visée
      description: Laisser vide pour tout effacer.
      selector:
        select:
          options:
            - label: Mildiou
              value: late_blight
            - label: Oïdium
              value: powdery_mildew

reset_powdery_mildew_index:
  name: Réinitialiser l'indice oïdium
  description: >-
    Remet l'indice Gubler-Thomas à zéro et annule le démarrage de
    l'épidémie. À utiliser en début de saison, ou après une remise à
    plat du vignoble ou de la parcelle.
