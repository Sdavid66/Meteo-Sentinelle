name: Tests des modèles

on:
  push:
  pull_request:

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exécuter la suite de tests des modèles
        run: python tests/test_models.py
