name: Tests des modèles

on:
  push:
  pull_request:

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sans PyYAML, les contrôles des blueprints se contentent de
      # s'ignorer : ils passeraient en silence sans rien vérifier.
      - name: Installer les dépendances de test
        run: pip install pyyaml pillow

      - name: Exécuter la suite de tests des modèles
        run: python tests/test_models.py

      - name: Exécuter la suite de tests ravageurs et pulvérisation
        run: python tests/test_pests.py

      - name: Exécuter les tests de la carte
        run: node tests/test_card.js

      # Le fichier est servi sans compilation : un `?.` suffit à le rendre
      # illisible pour le WebView d'un écran mural sous Android 8.
      - name: Vérifier que la carte reste lisible par les vieux navigateurs
        run: npx --yes acorn@8 --ecma2017 --silent custom_components/meteo_sentinelle/frontend/meteo-sentinelle-card.js

      - name: Contrôler la structure de l'intégration
        run: python scripts/check_integration.py .
