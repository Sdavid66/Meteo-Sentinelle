log_treatment:
  name: Enregistrer un traitement
  description: >-
    Déclare une application de traitement. Le plugin en déduit jusqu'à
    quand la culture est protégée, en tenant compte de la rémanence et du
    lessivage par la pluie. Renseignez ces deux valeurs d'après
    l'étiquette du produit.
  fields:
    target:
      name: Maladie visée
      description: Modèle de risque concerné par le traitement.
      required: true
      selector:
        select:
          options:
            - label: Mildiou
              value: late_blight
            - label: Oïdium
              value: powdery_mildew
    tree:
      name: Arbre(s)
      description: >-
        Nom du ou des arbres traités, tel qu'affiché dans Home Assistant
        (ex. « Pommier Golden »). Laisser vide pour appliquer à tous les
        arbres concernés par cette maladie.
      example: Pommier Golden
      selector:
        object:
    product:
      name: Produit
      description: Nom du produit appliqué, à titre de traçabilité.
      example: Bouillie bordelaise
      selector:
        text:
    residual_days:
      name: Rémanence (jours)
      description: Durée de protection nominale indiquée par le fabricant.
      default: 7
      selector:
        number:
          min: 0
          max: 90
          step: 0.5
          unit_of_measurement: jours
          mode: box
    rainfast_mm:
      name: Lessivage (mm)
      description: >-
        Cumul de pluie à partir duquel la protection est considérée comme
        perdue. Mettre 0 pour désactiver la prise en compte du lessivage.
      default: 20
      selector:
        number:
          min: 0
          max: 500
          step: 1
          unit_of_measurement: mm
          mode: box

clear_treatment:
  name: Effacer un traitement
  description: Supprime le traitement enregistré.
  fields:
    target:
      name: Maladie visée
      description: Laisser vide pour effacer toutes les maladies.
      selector:
        select:
          options:
            - label: Mildiou
              value: late_blight
            - label: Oïdium
              value: powdery_mildew
    tree:
      name: Arbre(s)
      description: Laisser vide pour effacer sur tous les arbres.
      selector:
        object:

reset_powdery_mildew_index:
  name: Réinitialiser l'indice oïdium
  description: >-
    Remet l'indice Gubler-Thomas à zéro et annule le démarrage de
    l'épidémie. À utiliser en début de saison.
  fields:
    tree:
      name: Arbre(s)
      description: Laisser vide pour réinitialiser tous les arbres.
      selector:
        object:

set_stage:
  name: Définir le stade phénologique
  description: >-
    Force le stade d'un ou plusieurs arbres. Une correction manuelle fait
    autorité : elle devient la nouvelle référence de l'avancement
    automatique.
  fields:
    tree:
      name: Arbre(s)
      description: Nom du ou des arbres concernés.
      required: true
      example: Pommier Golden
      selector:
        object:
    stage:
      name: Stade
      description: >-
        Clé technique du stade (ex. full_bloom, green_tip). Visible dans
        l'attribut « stage_key » du capteur de stade.
      required: true
      example: full_bloom
      selector:
        text:
